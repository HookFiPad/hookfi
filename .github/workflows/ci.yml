name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Syntax
        run: for f in server/*.js lib/*.js sdk/*.js test/*.js; do node --check "$f"; done
      - name: Unit tests
        run: npm run test:unit

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge --version
      - name: Build
        run: forge build --sizes
      - name: Fuzz and invariant tests
        run: forge test

  slither:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: crytic/slither-action@v0.4.2
        with:
          target: contracts/
          slither-args: --filter-paths "lib/|test/|script/"
          fail-on: high
