[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 20000
bytecode_hash = "none"
cbor_metadata = false
remappings = ["v4-core/=lib/v4-core/", "forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read", path = "./out" }]

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
base = "https://mainnet.base.org"
unichain = "https://mainnet.unichain.org"
